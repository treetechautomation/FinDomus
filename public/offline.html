<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A0E14">
<title>FinDomus — Offline</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0A0E14;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100dvh}
  .card{text-align:center;padding:2rem}
  .logo{width:80px;height:80px;margin:0 auto 1.5rem;border-radius:20px;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#eab308}
  h1{font-size:1.25rem;font-weight:600;margin-bottom:.5rem}
  p{font-size:.875rem;color:#94a3b8;margin-bottom:2rem}
  button{background:#eab308;color:#0A0E14;border:none;padding:.75rem 2rem;border-radius:.5rem;font-size:.875rem;font-weight:600;cursor:pointer}
  button:hover{background:#caa108}
</style>
</head>
<body>
<div class="card">
  <div class="logo">F</div>
  <h1>Voce esta offline</h1>
  <p>Conecte-se a internet para continuar usando o FinDomus.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</div>
</body>
</html>
